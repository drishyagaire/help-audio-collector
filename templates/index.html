<!DOCTYPE html>
<html>
<head>
  <title>Audio Collection Portal</title>
</head>
<body>

<h2>Help Audio Dataset Collection</h2>

<p>
  🎯 <b>Instruction:</b> Please record yourself saying <b>"HELP"</b> in each emotion.<br>
  You must provide <b>at least 5 recordings for EACH category</b>.
</p>

<p>Select the emotion for saying <b>"HELP"</b>:</p>

<button onclick="setCategory('angry')">😠 Angry</button>
<button onclick="setCategory('disgust')">🤢 Disgust</button>
<button onclick="setCategory('fear')">😨 Fear</button>
<button onclick="setCategory('happy')">😄 Happy</button>
<button onclick="setCategory('sad')">😢 Sad</button>
<button onclick="setCategory('neutral')">😐 Neutral</button>
<button onclick="setCategory('surprise')">😲 Surprise</button>

<p id="status" style="margin-top:10px; font-weight:bold;"></p>

<hr>

<button id="start">🎙 Start Recording</button>
<button id="stop" disabled>⏹ Stop Recording</button>

<br><br>

<audio id="audio" controls></audio>

<br><br>

<button id="upload">⬆ Upload Audio</button>

</body>
</html>
